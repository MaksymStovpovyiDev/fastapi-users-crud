[project]
name = "users-crud"
version = "0.1.0"
description = "A small FastAPI and SQLite learning project"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.30,<1", "email-validator>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
